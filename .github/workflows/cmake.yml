name: cmake
on: [check_run, push, pull_request]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cmake-publish:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        cxx_standard: [11, 17, 20]
        secure_memory: [ON, OFF]
        
    steps:
      - name: checkout project
        uses: actions/checkout@v5

      - name: build project
        uses: threeal/cmake-action@v2.0.0
        with:
          build-dir: build
          options: |
            CMAKE_CXX_STANDARD=${{ matrix.cxx_standard }}
            CMAKE_BUILD_TYPE=Debug
            JSONCPP_USE_SECURE_MEMORY=${{ matrix.secure_memory }}
          build-args: --config Debug

      - name: test project
        run: ctest --test-dir build --build-config Debug --output-on-failure --no-tests=error
        
